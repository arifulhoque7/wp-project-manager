name: Playwright tests/e2e

on:
  workflow_dispatch:
    inputs:
      testsuite:
        description: 'Test suite to run'
        required: true
        default: 'E2E'
        type: choice
        options:
          - 'E2E'
  schedule:
    # 1:00 AM Bangladesh Time (Sunday)
    - cron: '0 19 * * 0'
  push:
    branches: ['develop']
  pull_request:
    branches: ['develop']

jobs:
  test:
    # Run on forks only — the canonical repos are covered elsewhere.
    if: github.repository != 'weDevsOfficial/wedevs-project-manager' && github.repository != 'weDevsOfficial/pm-pro'
    timeout-minutes: 120
    runs-on: ubuntu-22.04

    steps:
      # Runner PHP for composer install only. The committed composer.lock pins
      # illuminate/* 5.8 (php ^7.1.3), so install on 7.4. wp-env runs its own 8.1.
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'

      - name: Checkout wedevs-project-manager
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Install e2e deps first so the always()-run summary step has node_modules
      # even if a later build/test step fails (keeps the failure signal clean).
      - name: Install e2e dependencies
        working-directory: tests/e2e-playwright
        run: pnpm install --frozen-lockfile

      # Build the Free plugin (vendor autoload + the React bundle the browser loads).
      - name: Build wedevs-project-manager
        run: |
          composer install --no-dev -o
          pnpm install --frozen-lockfile
          pnpm build

      # wp-env loads support plugins from <repo>/plugins/* (see .wp-env.json).
      - name: Fetch support plugins
        run: |
          mkdir -p plugins
          cd plugins
          for slug in wp-mail-log wp-reset; do
            wget -q "https://downloads.wordpress.org/plugin/${slug}.latest-stable.zip"
            unzip -q "${slug}.latest-stable.zip"
            rm "${slug}.latest-stable.zip"
          done

      - name: Start WordPress env
        working-directory: tests/e2e-playwright
        run: npx wp-env start

      # The role/permission specs log in as pre-existing PM users; seed them into
      # the tests instance (localhost:8889). Defaults mirror utils/testData.ts.
      - name: Seed QA users
        working-directory: tests/e2e-playwright
        run: |
          npx wp-env run tests-cli wp user create pm_manager_user  pm_manager@example.com  --role=subscriber --user_pass=password
          npx wp-env run tests-cli wp user create pm_coworker_user pm_coworker@example.com --role=subscriber --user_pass=password
          npx wp-env run tests-cli wp user create pm_client_user   pm_client@example.com   --role=subscriber --user_pass=password
          npx wp-env run tests-cli wp user create pm_member_user   pm_member@example.com   --role=subscriber --user_pass=password

      - name: Cache Playwright binaries
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('tests/e2e-playwright/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Install Playwright browser binaries
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: tests/e2e-playwright
        run: npx playwright install chromium --with-deps

      - name: 🧪 Run e2e tests
        env:
          CI: true
          QA_BASE_URL: http://localhost:8889
          QA_ADMIN_USERNAME: admin
          QA_ADMIN_PASSWORD: password
        if: success() && (github.event_name != 'workflow_dispatch' || github.event.inputs.testsuite == 'E2E')
        working-directory: tests/e2e-playwright
        run: |
          mkdir -p test-results
          pnpm run test:sharded:ci

      - name: Generate test summary
        if: always()
        working-directory: tests/e2e-playwright
        run: pnpm run sharded-summary

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/e2e-playwright/playwright-report/
            tests/e2e-playwright/test-results/
          retention-days: 7
