name: Playwright tests/e2e

on:
  workflow_dispatch:
    inputs:
      testsuite:
        description: 'Test suite to run'
        required: true
        default: 'E2E'
        type: choice
        options:
          - 'E2E'
  schedule:
    # 1:00 AM Bangladesh Time (Sunday)
    - cron: '0 19 * * 0'
  push:
    branches: ['develop', 'test/e2e-free-pro-coverage']
  pull_request:
    branches: ['develop']

jobs:
  test:
    name: e2e (${{ matrix.group }})
    # Run on forks only — the canonical repos are covered elsewhere.
    if: github.repository != 'weDevsOfficial/wedevs-project-manager' && github.repository != 'weDevsOfficial/pm-pro'
    timeout-minutes: 60
    runs-on: ubuntu-22.04
    strategy:
      # Feature-grouped shards: each job runs a set of feature FOLDERS so related
      # specs stay together. Shards are independent — each self-contained (its own
      # wp-env + the setup project runs first, within the shard, for auth); no job
      # depends on another (only merge-report waits on all).
      fail-fast: false
      matrix:
        include:
          - group: core
            folders: tests/projects tests/tasks tests/task-lists tests/categories
          - group: content
            folders: tests/milestones tests/discussions tests/files tests/kanban tests/my-tasks tests/overview
          - group: admin
            folders: tests/search tests/activity tests/settings tests/roles tests/upsell tests/auth

    steps:
      - name: Checkout wedevs-project-manager
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install e2e dependencies
        working-directory: tests/e2e-playwright
        run: pnpm install --frozen-lockfile

      # Build the Free plugin (vendor autoload + the React bundle the browser loads).
      # composer.lock pins illuminate/* 5.8 (php ^7.1.3); the runner's PHP is 8.x,
      # so ignore the platform check — post-install patch-deprecations.php makes it 8-safe.
      - name: Build wedevs-project-manager
        run: |
          composer install --no-dev -o --ignore-platform-reqs
          pnpm install --frozen-lockfile
          pnpm build

      # wp-env loads support plugins from <repo>/plugins/* (see .wp-env.json).
      - name: Fetch support plugins
        run: |
          mkdir -p plugins && cd plugins
          wget -q "https://downloads.wordpress.org/plugin/wp-mail-log.latest-stable.zip"
          unzip -q "wp-mail-log.latest-stable.zip" && rm "wp-mail-log.latest-stable.zip"

      # wp-env applies .wp-env.json: 1024M memory + mu-plugins (pretty permalinks,
      # drop admin pointers) + WP_DEBUG_LOG → wp-data/debug.log. No wp-cli setup.
      - name: Start WordPress env
        working-directory: tests/e2e-playwright
        run: npx wp-env start

      # Role/permission specs log in as pre-existing PM users (defaults mirror
      # utils/testData.ts). No pm_client_user — client role is Pro-only (RMX0003 skips).
      - name: Seed QA users
        working-directory: tests/e2e-playwright
        run: |
          npx wp-env run tests-cli wp user create pm_manager_user  pm_manager@example.com  --role=subscriber --user_pass=password
          npx wp-env run tests-cli wp user create pm_coworker_user pm_coworker@example.com --role=subscriber --user_pass=password
          npx wp-env run tests-cli wp user create pm_member_user   pm_member@example.com   --role=subscriber --user_pass=password

      - name: Cache Playwright binaries
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('tests/e2e-playwright/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: Install Playwright browser binaries
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: tests/e2e-playwright
        run: npx playwright install chromium --with-deps

      - name: 🧪 Run e2e tests (${{ matrix.group }})
        env:
          CI: true
          QA_BASE_URL: http://localhost:8889
          QA_ADMIN_USERNAME: admin
          QA_ADMIN_PASSWORD: password
        if: success() && (github.event_name != 'workflow_dispatch' || github.event.inputs.testsuite == 'E2E')
        working-directory: tests/e2e-playwright
        # setup project runs first (dependency) for auth, then this group's folders.
        run: pnpm exec playwright test ${{ matrix.folders }}

      # PHP notices/errors land in wp-data/debug.log (WP_DEBUG_LOG); surface on failure.
      - name: Surface WP debug.log
        if: always()
        working-directory: tests/e2e-playwright
        run: test -s wp-data/debug.log && { echo '--- wp-data/debug.log ---'; cat wp-data/debug.log; } || echo 'debug.log empty'

      # Each shard emits a blob report; the merge job stitches them into one HTML.
      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.group }}
          path: tests/e2e-playwright/blob-report
          retention-days: 3

  merge-report:
    name: merge shard reports
    if: always() && github.repository != 'weDevsOfficial/wedevs-project-manager' && github.repository != 'weDevsOfficial/pm-pro'
    needs: [test]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install e2e dependencies
        working-directory: tests/e2e-playwright
        run: pnpm install --frozen-lockfile
      - name: Download shard blob reports
        uses: actions/download-artifact@v4
        with:
          path: tests/e2e-playwright/all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      # Results TABLE straight on the run page (Summary tab) — no download needed.
      - name: Results summary table
        if: always()
        working-directory: tests/e2e-playwright
        run: |
          pnpm exec playwright merge-reports --reporter=json ./all-blob-reports > merged-results.json 2>/dev/null || true
          node utils/ghSummary.mjs merged-results.json
      # Full HTML report kept as a downloadable artifact for deep dives.
      - name: Merge into one HTML report
        if: always()
        working-directory: tests/e2e-playwright
        run: pnpm exec playwright merge-reports --reporter=html ./all-blob-reports
      - name: Upload HTML report (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e-playwright/playwright-report
          retention-days: 7
